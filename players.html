<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Player Cards — 2128 News</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    :root{
      --gold:#d4b06a; --card-w:320px; --card-h:480px; --radius:18px;
      --shadow:0 12px 30px rgba(0,0,0,.45);
      --transition: transform .8s cubic-bezier(.2,.7,.2,1), box-shadow .2s ease;
    }
    *{box-sizing:border-box}
    body{margin:0; color:#eef2ff; font:16px/1.6 system-ui, -apple-system, Segoe UI, Inter, Roboto, Arial;
      background: radial-gradient(1100px 560px at 50% -10%, #1a2147 0%, #0b1030 42%, #060915 100%);}
    .wrap{max-width:1200px;margin:0 auto;padding:40px 16px}
    header{text-align:center;margin:0 0 24px}
    header h1{margin:0 0 6px;font-size:clamp(1.2rem,1.6vw + 1rem,2rem);letter-spacing:.5px;text-transform:uppercase}
    header p{margin:0;opacity:.85}
    .status{margin:8px 0 18px; text-align:center; font-size:.95rem; color:#cbd5ff; opacity:.9}

    /* Controls */
    .controls{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:0 0 24px;padding:0 16px}
    .controls input[type="text"]{
      background:rgba(255,255,255,.08);border:1px solid rgba(212,176,106,.3);border-radius:8px;
      padding:10px 14px;color:#eef2ff;font-size:.95rem;min-width:200px;flex:1;max-width:360px}
    .controls input::placeholder{color:#8892bb}
    .controls input:focus{outline:3px solid #88a2ff;border-color:#88a2ff}
    .controls select{
      background:rgba(255,255,255,.08);border:1px solid rgba(212,176,106,.3);border-radius:8px;
      padding:10px 14px;color:#eef2ff;font-size:.95rem;cursor:pointer;appearance:auto}
    .controls select:focus{outline:3px solid #88a2ff;border-color:#88a2ff}

    /* Grid */
    .grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(var(--card-w),1fr));justify-items:center}

    /* Card flip */
    .card-outer{perspective:1400px}
    .card{width:var(--card-w);height:var(--card-h);position:relative;transform-style:preserve-3d;
      border-radius:var(--radius);transition:var(--transition);box-shadow:var(--shadow);cursor:pointer}
    .card-outer:hover .card:not(.noflip){transform:rotateY(180deg)}
    .card-outer:focus-within .card:not(.noflip){transform:rotateY(180deg)}
    .card:focus{outline:4px solid #88a2ff;outline-offset:6px}
    @media (prefers-reduced-motion: reduce){
      .card{transition:box-shadow .2s ease}
      .card-outer:hover .card,.card-outer:focus-within .card{transform:none}
      .card.is-flipped{transform:rotateY(180deg)}
    }
    .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--radius);overflow:hidden}

    /* Front */
    .front{background:linear-gradient(180deg,#0e1433 0%,#0a0f24 60%,#070b1a 100%);border:1px solid rgba(212,176,106,.35)}
    .front img{width:100%;height:100%;object-fit:cover;border-radius:var(--radius)}

    /* Back */
    .back{transform:rotateY(180deg);background:linear-gradient(180deg,#0c122f 0%,#070b1a 80%);border:1px solid rgba(212,176,106,.35)}
    .back-img{width:100%;height:100%;object-fit:cover;border-radius:var(--radius)}
    .back-text{position:absolute;inset:40px 36px;display:flex;align-items:center;justify-content:center;
      padding:16px;text-align:center;font-size:1rem;line-height:1.6;color:#2a1f0e;
      font-style:italic;font-family:Georgia,'Times New Roman',serif}
    .back-text p{margin:0;max-width:160px;text-shadow:0 0 8px rgba(255,245,220,.4)}

    /* Coming soon placeholder */
    .placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;
      width:100%;height:100%;text-align:center;padding:30px 20px;color:#b9c3ff;font-size:1rem}
    .placeholder .name{font-size:1.15rem;font-weight:600;color:#eef2ff;margin-bottom:4px}
    .placeholder .alliance{font-size:.85rem;color:#d4b06a;margin-bottom:12px}

    /* CTA card */
    .cta-link{display:flex;flex-direction:column;align-items:center;justify-content:center;
      width:100%;height:100%;text-align:center;padding:30px 20px;color:#fff;text-decoration:none;
      border-radius:var(--radius);background:linear-gradient(180deg,#0e1433 0%,#0a0f24 60%,#070b1a 100%);
      border:1px solid rgba(212,176,106,.35)}
    .cta-link:hover,.cta-link:focus{border-color:var(--gold);box-shadow:0 0 20px rgba(212,176,106,.25)}
    .cta-link:focus{outline:3px solid #88a2ff}

    /* Flip button — hidden on desktop, visible on touch/reduced-motion */
    .flip-btn{position:absolute;right:10px;top:10px;z-index:2;background:rgba(10,15,36,.6);color:#fff;
      border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:6px 10px;font-size:.8rem;
      backdrop-filter:blur(4px);cursor:pointer;display:none}
    .flip-btn:focus{outline:3px solid #88a2ff}
    @media (hover: none),(prefers-reduced-motion: reduce){
      .flip-btn{display:block}
    }

    .no-results{text-align:center;color:#b9c3ff;font-size:1rem;padding:40px 0;grid-column:1/-1}
    .sr-only{position:absolute!important;height:1px;width:1px;overflow:hidden;clip:rect(1px,1px,1px,1px);white-space:nowrap}
  </style>
</head>
<body>

  <div id="nav-placeholder"></div>

  <div class="wrap">
    <header>
      <h1>Player Cards</h1>
      <p>Hover (desktop) or tap <strong>Flip</strong> (mobile / reduced-motion) to see the back.</p>
      <div id="status" class="status">Loading cards…</div>
    </header>

    <div class="controls" role="search" aria-label="Filter player cards">
      <label class="sr-only" for="search-input">Search by player name</label>
      <input type="text" id="search-input" placeholder="Search by name…" />
      <label class="sr-only" for="alliance-filter">Filter by alliance</label>
      <select id="alliance-filter"><option value="">All Alliances</option></select>
      <label class="sr-only" for="sort-select">Sort cards</label>
      <select id="sort-select">
        <option value="newest">Newest First</option>
        <option value="oldest">Oldest First</option>
        <option value="name-az">Name A–Z</option>
        <option value="name-za">Name Z–A</option>
        <option value="alliance">By Alliance</option>
      </select>
    </div>

    <section class="grid" aria-label="Player card gallery" id="card-grid"></section>
  </div>

  <div id="footer-placeholder"></div>

  <noscript><p class="status">JavaScript is required to load cards.</p></noscript>

  <script>
    const setStatus = msg => { const el = document.getElementById('status'); if (el) el.textContent = msg; };

    // Load nav/footer
    fetch('/nav.html').then(r=>r.ok?r.text():Promise.reject(r.status)).then(h=>{
      document.getElementById('nav-placeholder').innerHTML = h;
    }).catch(e=>console.warn('Nav load failed:', e));
    fetch('/footer.html').then(r=>r.ok?r.text():Promise.reject(r.status)).then(h=>{
      document.getElementById('footer-placeholder').innerHTML = h;
    }).catch(e=>console.warn('Footer load failed:', e));

    // Flip logic
    document.addEventListener('click', e => {
      const btn = e.target.closest('.flip-btn');
      if (!btn) return;
      const card = btn.closest('.card');
      const flipped = card.classList.toggle('is-flipped');
      btn.setAttribute('aria-pressed', flipped ? 'true' : 'false');
    });

    // Main
    (async () => {
      try {
        const url = 'https://script.google.com/macros/s/AKfycbybmxe-dbKeru59gp0fmiaH_j8_fofOIju_wFOCWV2SaGfd8D1KiIMxVI53uAKqbPm8/exec';
        const res = await fetch(url, { method:'GET', headers: { 'Accept': 'application/json' }});
        if (!res.ok) throw new Error('Feed HTTP ' + res.status);
        const raw = await res.json();
        if (!Array.isArray(raw)) throw new Error('Feed not an array');

        // Filter to cards with names, store with index for sort stability
        let cards = raw.filter(c => (c.name || '').trim()).map((c, i) => ({ ...c, _idx: i }));

        // Build alliance dropdown
        const alliances = [...new Set(cards.map(c => (c.alliance || '').trim()).filter(Boolean))].sort();
        const allianceSelect = document.getElementById('alliance-filter');
        alliances.forEach(a => {
          const opt = document.createElement('option');
          opt.value = a; opt.textContent = a;
          allianceSelect.appendChild(opt);
        });

        const grid = document.getElementById('card-grid');
        const searchInput = document.getElementById('search-input');
        const sortSelect = document.getElementById('sort-select');

        function renderCards() {
          const query = searchInput.value.toLowerCase().trim();
          const allianceVal = allianceSelect.value;
          const sortVal = sortSelect.value;

          // Filter
          let filtered = cards.filter(c => {
            const nameMatch = !query || c.name.toLowerCase().includes(query);
            const allianceMatch = !allianceVal || (c.alliance || '') === allianceVal;
            return nameMatch && allianceMatch;
          });

          // Sort
          filtered.sort((a, b) => {
            switch (sortVal) {
              case 'newest': return b._idx - a._idx;
              case 'oldest': return a._idx - b._idx;
              case 'name-az': return a.name.localeCompare(b.name);
              case 'name-za': return b.name.localeCompare(a.name);
              case 'alliance': return (a.alliance || '').localeCompare(b.alliance || '') || a.name.localeCompare(b.name);
              default: return 0;
            }
          });

          grid.innerHTML = '';

          // CTA card first
          grid.insertAdjacentHTML('beforeend', `
            <article class="card-outer" aria-label="Get your own Player Card">
              <div class="card noflip">
                <a class="cta-link" href="https://forms.gle/StCbCzoMK8Fv6yAZ6" target="_blank" rel="noopener">
                  <span style="font-size:1.3rem;font-weight:600;">✨ Want your own<br>Player Card?</span>
                  <span style="margin-top:12px;font-size:1rem;opacity:.9;">$2 — Click here to order</span>
                </a>
              </div>
            </article>`);

          if (!filtered.length) {
            grid.insertAdjacentHTML('beforeend', '<p class="no-results">No cards match your search.</p>');
            setStatus('No matches found.');
            return;
          }

          filtered.forEach(c => {
            const name = c.name.trim();
            const alt = c.alt || (name + ' player card');
            const hasFront = c.front && c.front.trim();
            const hasBack = c.back && c.back.trim();
            const backText = (c.back_text || '').trim();
            const alliance = (c.alliance || '').trim();
            const title = (c.title || '').trim();
            const esc = s => s.replace(/"/g, '&quot;').replace(/</g, '&lt;');

            let frontHTML, backHTML;

            if (hasFront) {
              frontHTML = `<div class="face front"><img src="${c.front}" alt="${esc(alt)}" loading="lazy" width="320" height="480" /></div>`;
            } else {
              frontHTML = `<div class="face front"><div class="placeholder"><span class="name">${esc(name)}</span>${alliance ? `<span class="alliance">${esc(alliance)}</span>` : ''}${title ? `<span>${esc(title)}</span>` : ''}<span style="margin-top:16px;opacity:.6">Card coming soon</span></div></div>`;
            }

            if (hasBack) {
              backHTML = `<div class="face back"><img class="back-img" src="${c.back}" alt="" loading="lazy" width="320" height="480" />${backText ? `<div class="back-text"><p>${esc(backText)}</p></div>` : ''}</div>`;
            } else {
              backHTML = `<div class="face back"><div class="placeholder">${backText ? `<p style="color:#eef2ff;max-width:200px;font-style:italic;font-family:Georgia,serif">${esc(backText)}</p>` : '<span style="opacity:.6">Back coming soon</span>'}</div></div>`;
            }

            grid.insertAdjacentHTML('beforeend', `
              <article class="card-outer" tabindex="0" aria-label="${esc(alt)}">
                <div class="card" role="img" aria-roledescription="flip card">
                  <button class="flip-btn" aria-pressed="false" aria-label="Flip ${esc(name)} card">Flip</button>
                  ${frontHTML}
                  ${backHTML}
                </div>
              </article>`);
          });

          setStatus(`Showing ${filtered.length} card${filtered.length > 1 ? 's' : ''}.`);
        }

        searchInput.addEventListener('input', renderCards);
        allianceSelect.addEventListener('change', renderCards);
        sortSelect.addEventListener('change', renderCards);

        renderCards();

      } catch (err) {
        console.error(err);
        setStatus('Could not load cards. Check console for details.');
      }
    })();
  </script>
</body>
</html>
